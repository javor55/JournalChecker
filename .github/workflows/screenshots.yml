name: Update README screenshots

# Run manually (Actions -> Update README screenshots -> Run workflow).
# Opens the app with the synthetic demo journal on Windows, saves screenshots
# to docs/screenshots and commits them.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow tkinterdnd2

      - name: Take screenshots
        run: python tools/make_screenshots.py demo/demo.Journal.tsv docs/screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png

      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update README screenshots"
            git push
          fi
